spring.application.name=supermarket-backend

spring.datasource.url=${DB_URL:jdbc:h2:mem:supermarket;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# dialect intentionally omitted - Hibernate auto-detects from JDBC driver (H2 or MySQL)
spring.jpa.open-in-view=false

# Connection pool (stability on Render free tier)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:10001}